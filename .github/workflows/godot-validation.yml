name: Godot Source Validation

on:
  push:
    branches: [main]
    paths:
      - "scripts/**/*.gd"
      - "scenes/**/*.tscn"
      - "project.godot"
      - ".github/workflows/godot-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare compressed character models for Godot
        run: |
          npm install --no-save --no-package-lock @gltf-transform/core @gltf-transform/extensions @gltf-transform/functions meshoptimizer
          node scripts/preprocess_glb.mjs

      - name: Download PBR textures required by main.gd preloads
        run: |
          mkdir -p assets/textures/pbr
          fetch_pbr() {
            asset="$1"
            prefix="$2"
            archive="/tmp/${asset}_1K-JPG.zip"
            folder="/tmp/${asset}_maps"
            curl -fsSL --retry 2 --connect-timeout 20 "https://ambientcg.com/get?file=${asset}_1K-JPG.zip" -o "$archive"
            mkdir -p "$folder"
            unzip -oq "$archive" -d "$folder"
            color_map="$(find "$folder" -type f -iname '*Color.jpg' | head -n 1)"
            normal_map="$(find "$folder" -type f -iname '*NormalGL.jpg' | head -n 1)"
            rough_map="$(find "$folder" -type f -iname '*Roughness.jpg' | head -n 1)"
            test -n "$color_map" && test -n "$normal_map" && test -n "$rough_map"
            cp "$color_map" "assets/textures/pbr/${prefix}_color.jpg"
            cp "$normal_map" "assets/textures/pbr/${prefix}_normal.jpg"
            cp "$rough_map" "assets/textures/pbr/${prefix}_roughness.jpg"
          }
          fetch_pbr "Road015A" "road"
          fetch_pbr "Grass005" "grass"
          fetch_pbr "Concrete007" "concrete"

      - name: Download footstep audio required by player and NPC preloads
        run: |
          mkdir -p assets/audio/footsteps
          for pair in "01-footstep_0.ogg:01-footstep.ogg" "02-footstep.ogg:02-footstep.ogg" "03-footstep.ogg:03-footstep.ogg" "04-footstep.ogg:04-footstep.ogg" "05-footstep.ogg:05-footstep.ogg" "06-footstep.ogg:06-footstep.ogg"; do
            source_name="${pair%%:*}"
            target_name="${pair##*:}"
            curl -fsSL --retry 3 "https://opengameart.org/sites/default/files/${source_name}" -o "assets/audio/footsteps/${target_name}"
            test -s "assets/audio/footsteps/${target_name}"
          done

      - name: Download real recorded city and vehicle audio
        run: |
          mkdir -p assets/audio
          curl -fsSL https://opengameart.org/sites/default/files/genericv8sound.zip -o /tmp/genericv8sound.zip
          mkdir -p /tmp/v8audio
          unzip -o /tmp/genericv8sound.zip -d /tmp/v8audio
          first_wav="$(find /tmp/v8audio -type f -iname '*.wav' | sort | head -n 1)"
          test -n "$first_wav"
          cp "$first_wav" assets/audio/car_engine_loop.wav
          curl -fsSL https://opengameart.org/sites/default/files/engine_start_up_01.wav -o assets/audio/car_start.wav
          curl -fsSL "https://opengameart.org/sites/default/files/city_ambience_-_traffic_-_street_-_cars_and_tram.mp3" -o assets/audio/city_traffic.mp3
          curl -fsSL https://opengameart.org/sites/default/files/crowd_-_mall_ambience.mp3 -o assets/audio/pedestrian_chatter.mp3
          mkdir -p assets/audio/footsteps
          for pair in "01-footstep_0.ogg:01-footstep.ogg" "02-footstep.ogg:02-footstep.ogg" "03-footstep.ogg:03-footstep.ogg" "04-footstep.ogg:04-footstep.ogg" "05-footstep.ogg:05-footstep.ogg" "06-footstep.ogg:06-footstep.ogg"; do
            source_name="${pair%%:*}"
            target_name="${pair##*:}"
            curl -fsSL "https://opengameart.org/sites/default/files/${source_name}" -o "assets/audio/footsteps/${target_name}"
          done
          curl -fsSL https://opengameart.org/sites/default/files/urban_theme_bpm115.mp3 -o assets/audio/menu_urban.mp3
          ls -lh assets/audio assets/audio/footsteps
      - name: Download additional CC0 city and vehicle GLB assets
        run: |
          mkdir -p assets/models/city/downtown assets/models/vehicles
          fetch_optional() {
            url="$1"
            target="$2"
            temp="${target}.download"
            if curl -fL --retry 2 --connect-timeout 20 "$url" -o "$temp" && test -s "$temp"; then
              mv "$temp" "$target"
              echo "Downloaded $target"
            else
              rm -f "$temp"
              echo "Optional asset unavailable: $target"
            fi
          }
          fetch_required() {
            url="$1"
            target="$2"
            curl -fsSL --retry 3 --connect-timeout 20 "$url" -o "$target"
            test -s "$target"
            magic="$(head -c 4 "$target")"
            if [ "$magic" != "glTF" ]; then
              echo "Downloaded file is not a binary glTF model: $target" >&2
              exit 1
            fi
            echo "Required GLB gameplay asset verified: $target"
          }
          fetch_optional "https://tevy.dev/models/apartment-block/v2/lod0.glb" "assets/models/city/downtown/apartment_block.glb"
          fetch_optional "https://grab3d.com/dl/high-rise-apartment/high-rise-apartment-light.glb" "assets/models/city/downtown/highrise_apartment.glb"
          # Mint realistic vehicle GLBs: detailed 18k–20k triangle models, CC0 1.0.
          # These are intentionally the only vehicle models used by gameplay.
          fetch_required "https://cdn.mint.gg/owned-artifacts/4ca9977517ee4cd3c8c1a12a44be9796942fc34b1e3f9334f9b6e0ca58af716c" "assets/models/vehicles/realistic_police.glb"
          fetch_required "https://cdn.mint.gg/owned-artifacts/888cbe2c9ab99868c0c5ee4f7e2a43b6dc75972c53bccf013422f2a2be323089" "assets/models/vehicles/realistic_suv.glb"
          fetch_required "https://cdn.mint.gg/owned-artifacts/94cdd5d52a8cc9f94a3f8f31dc74f6e0e10eb6575ed735cc589f81312bd512d8" "assets/models/vehicles/realistic_pickup.glb"
          fetch_required "https://cdn.mint.gg/owned-artifacts/26d6ce9c917f14b4446d813b0c01326609af064a4d34baee122c195d93793c7a" "assets/models/vehicles/realistic_firetruck.glb"
          fetch_required "https://cdn.mint.gg/owned-artifacts/a48562173ee793d79703636cb0ccc623ae9b75bd3299837797fbad45f7dc6946" "assets/models/vehicles/realistic_sports.glb"
          fetch_required "https://cdn.mint.gg/owned-artifacts/6b6203883c279bfad13d080cf069b777eb0ae4cc70e04533f9e52360c744ad91" "assets/models/vehicles/realistic_taxi.glb"
          fetch_required "https://cdn.mint.gg/owned-artifacts/cfcac5c511c1bbb21b9449bbd56a5256b29c31762946c5b8ced3b1f7339da50b" "assets/models/vehicles/realistic_ambulance.glb"
          # Silver sedan direct asset, used as the regular civilian car.
          fetch_required "https://cdn.mint.gg/owned-artifacts/f25096fa940b1ece067017b70fff6d9dff65aa610aabb08c3015b545d4a9c379" "assets/models/vehicles/realistic_sedan.glb"
          mkdir -p assets/sky
          fetch_optional "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/kloofendal_48d_partly_cloudy_puresky_1k.hdr" "assets/sky/cloudy_day_1k.hdr"
          ls -lh assets/models/city/downtown assets/models/vehicles
      - name: Download detailed Vinish City Kit GLB models
        run: |
          mkdir -p assets/models/vinish_city
          fetch_city_asset() {
            source="$1"
            target="$2"
            output="assets/models/vinish_city/$target"
            curl -fsSL --retry 3 --connect-timeout 20 "$source" -o "$output"
            test -s "$output"
            magic="$(head -c 4 "$output")"
            if [ "$magic" != "glTF" ]; then
              echo "Downloaded file is not a binary glTF model: $output" >&2
              exit 1
            fi
            echo "Verified GLB city asset: $target"
          }
          fetch_city_asset "https://models.vinish.dev/city-kit/road-straight.glb" "road-straight.glb"
          fetch_city_asset "https://models.vinish.dev/city-kit/apartment-block-01.glb" "apartment-block-01.glb"
          fetch_city_asset "https://models.vinish.dev/city-kit/apartment-block-02.glb" "apartment-block-02.glb"
          fetch_city_asset "https://models.vinish.dev/city-kit/road-crossroads.glb" "road-crossroads.glb"
          fetch_city_asset "https://models.vinish.dev/city-kit/road-t-junction.glb" "road-t-junction.glb"
          fetch_city_asset "https://models.vinish.dev/city-kit/road-bend.glb" "road-bend.glb"
          fetch_city_asset "https://models.vinish.dev/city-kit/sidewalk-block.glb" "sidewalk-block.glb"
          fetch_city_asset "https://models.vinish.dev/city-kit/street-light.glb" "street-light.glb"
          fetch_city_asset "https://models.vinish.dev/city-kit/traffic-signal.glb" "traffic-signal.glb"
          fetch_city_asset "https://models.vinish.dev/city-kit/fire-hydrant.glb" "fire-hydrant.glb"
          ls -lh assets/models/vinish_city
      - name: Install Godot 4.3
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee godot-validation.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-validation.log; then
            echo "Godot reported script or resource parse errors."
            exit 1
          fi

      - name: Launch main scene headlessly
        shell: bash
        run: |
          set -o pipefail
          Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 180 2>&1 | tee godot-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:" godot-runtime.log; then
            echo "Godot reported runtime startup errors."
            exit 1
          fi
