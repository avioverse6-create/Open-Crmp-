name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Open City APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          packages: ''
      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          adb version
      - name: Generate temporary Android debug keystore
        run: |
          mkdir -p build
          keytool -genkeypair -v -keystore build/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Prepare compressed character models for Godot
        run: |
          npm install --no-save --no-package-lock @gltf-transform/core @gltf-transform/extensions @gltf-transform/functions meshoptimizer
          node scripts/preprocess_glb.mjs
      - name: Download real recorded city and vehicle audio
        run: |
          mkdir -p assets/audio
          curl -fsSL https://opengameart.org/sites/default/files/genericv8sound.zip -o /tmp/genericv8sound.zip
          mkdir -p /tmp/v8audio
          unzip -o /tmp/genericv8sound.zip -d /tmp/v8audio
          first_wav="$(find /tmp/v8audio -type f -iname '*.wav' | sort | head -n 1)"
          test -n "$first_wav"
          cp "$first_wav" assets/audio/car_engine_loop.wav
          curl -fsSL https://opengameart.org/sites/default/files/engine_start_up_01.wav -o assets/audio/car_start.wav
          curl -fsSL "https://opengameart.org/sites/default/files/city_ambience_-_traffic_-_street_-_cars_and_tram.mp3" -o assets/audio/city_traffic.mp3
          curl -fsSL https://opengameart.org/sites/default/files/crowd_-_mall_ambience.mp3 -o assets/audio/pedestrian_chatter.mp3
          mkdir -p assets/audio/footsteps
          for pair in "01-footstep_0.ogg:01-footstep.ogg" "02-footstep.ogg:02-footstep.ogg" "03-footstep.ogg:03-footstep.ogg" "04-footstep.ogg:04-footstep.ogg" "05-footstep.ogg:05-footstep.ogg" "06-footstep.ogg:06-footstep.ogg"; do
            source_name="${pair%%:*}"
            target_name="${pair##*:}"
            curl -fsSL "https://opengameart.org/sites/default/files/${source_name}" -o "assets/audio/footsteps/${target_name}"
          done
          curl -fsSL https://opengameart.org/sites/default/files/urban_theme_bpm115.mp3 -o assets/audio/menu_urban.mp3
          ls -lh assets/audio assets/audio/footsteps
      - name: Download additional CC0 city and vehicle GLB assets
        run: |
          mkdir -p assets/models/city/downtown assets/models/vehicles
          fetch_optional() {
            url="$1"
            target="$2"
            temp="${target}.download"
            if curl -fL --retry 2 --connect-timeout 20 "$url" -o "$temp" && test -s "$temp"; then
              mv "$temp" "$target"
              echo "Downloaded $target"
            else
              rm -f "$temp"
              echo "Optional asset unavailable: $target"
            fi
          }
          fetch_optional "https://tevy.dev/models/apartment-block/v2/lod0.glb" "assets/models/city/downtown/apartment_block.glb"
          fetch_optional "https://grab3d.com/dl/high-rise-apartment/high-rise-apartment-light.glb" "assets/models/city/downtown/highrise_apartment.glb"
          fetch_optional "https://cdn.mint.gg/owned-artifacts/a48562173ee793d79703636cb0ccc623ae9b75bd3299837797fbad45f7dc6946" "assets/models/vehicles/realistic_sports.glb"
          ls -lh assets/models/city/downtown assets/models/vehicles
      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Export Android APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          verbose: true
      - name: Copy exported APK to artifact folder
        run: |
          mkdir -p build
          cp "$HOME/.local/share/godot/builds/Android/OpenCity-debug.apk" build/OpenCity-debug.apk
          test -s build/OpenCity-debug.apk
          ls -lh build/OpenCity-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenCity-Android-debug
          path: build/OpenCity-debug.apk
          if-no-files-found: error
          retention-days: 14
